[project]
name = "data-prep"
version = "0.1.0"
description = "Dataset workshop: synthetic dataset generation + refine toolbox for the WLO classification API"
license = {text = "MIT"}
# 3.12 floor: numpy 2.4 type stubs use PEP-695 `type` statements, which mypy
# only accepts from python_version 3.12 on.
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "python-multipart>=0.0.31",
    "pandas>=2.1",
    "openai>=1.40",
    "model2vec>=0.3",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.4", "mypy>=1.9", "types-PyYAML>=6.0"]

# No build-system on purpose: this is an application, not a library.
# Install runtime deps with `pip install -r requirements.txt` and run via uvicorn.

[tool.pytest.ini_options]
markers = ["live: calls the real LLM API — excluded by default, run via `pytest -m live`"]
addopts = "-m \"not live\""

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# SIM108: forcing multi-line ternaries hurts readability here.
ignore = ["SIM108"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Security()/File()/Form()/Body()/Query() in argument
# defaults is the intended idiom, not a bug.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Security",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Body",
    "fastapi.Query",
]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
disable_error_code = ["import-untyped"]
